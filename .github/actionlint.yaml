# actionlint configuration.
#
# One label, declared because actionlint's built-in list is behind GitHub. It
# refuses `ubuntu-26.04` — "label is unknown. available labels are …" — while
# the runner plainly exists: a job on it resolved to `GitHub Actions
# 1000042524` and four of this repository's jobs completed on it. v1.7.12 is
# the newest release, so there is no version to bump to.
#
# Under `self-hosted-runner` because that is the only key actionlint offers for
# a label it does not know, and its own error message says to use it. Nothing
# here is self-hosted.
#
# Delete this when a release knows the label. Until then it widens the known
# set by exactly one name and everything else still validates.
self-hosted-runner:
  labels:
    - ubuntu-26.04
