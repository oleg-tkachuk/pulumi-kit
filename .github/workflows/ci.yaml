name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing at the top level — each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job pins the runner rather than taking `ubuntu-latest`, which each of
# them warned about:
#
#   The ubuntu-latest label will migrate to Ubuntu 26 beginning October 19, 2026
#
# A floating label means the OS under these jobs changes on a date nobody here
# chose — the same argument this repository makes about `@latest` for its own
# module. Pinned, that migration is a commit. It is spelled per job because
# `runs-on` reads neither `env` nor a workflow-level default.
#
# Pinned tools. The `renovate:` annotations are the style hetzner-iac uses and
# are inert here until a bot reads them: .github/dependabot.yml covers the
# module, the actions and npm, and not these three, so they are bumped by hand.
env:
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: "v1.8.0"
  # renovate: datasource=go depName=github.com/rhysd/actionlint
  ACTIONLINT_VERSION: "v1.7.12"
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: "1.30.1"

jobs:
  # Whether anything the checks below read has changed.
  #
  # An EXCLUSION list, and the direction matters more than its contents: an
  # inclusion list has to be extended for each new kind of input, and
  # forgetting is silent and green. Excluding documentation cannot fail that
  # way — a file type nobody has thought about yet is relevant by default.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff below needs both ends of it.
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          inert='(^|/)[^/]*\.md$|^docs/|^LICENSE$|^\.gitignore$|\.(png|jpe?g|svg|gif)$'

          if [ -z "${BASE:-}" ]; then
            # A push to main: always relevant, so the release path is never
            # gated on a diff computation.
            printf '%s\n' "relevant=true" >>"$GITHUB_OUTPUT"
            printf '%s\n' "push to main — running everything"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE" "$HEAD")"
          printf '%s\n' "$changed"

          # grep exits 1 when every line is inert, which is an answer here.
          relevant="$(printf '%s\n' "$changed" | grep -vE "$inert" || true)"

          if [ -n "$relevant" ]; then
            printf '%s\n' "relevant=true" >>"$GITHUB_OUTPUT"
            printf '%s\n' "outside documentation:"
            printf '%s\n' "$relevant" | sed 's/^/  /'
          else
            printf '%s\n' "relevant=false" >>"$GITHUB_OUTPUT"
            printf '%s\n' "documentation only — the checks below will report as skipped"
          fi

  test:
    name: Build, vet and test
    needs: [changes]
    if: needs.changes.outputs.relevant != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Named files rather than a count, so the failure says which one.
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # -race because both commands shell out and parse, and a data race in a
      # tool that decides what gets destroyed is not a failure to discover
      # from behaviour.
      - run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage per package
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.relevant != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # gosec is one of the linters in .golangci.yaml, so this covers the
      # security pass over the Go code as well.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9

  vuln:
    name: Reachable vulnerabilities
    needs: [changes]
    if: needs.changes.outputs.relevant != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Reachable, not merely present: govulncheck reports an advisory only
      # when a vulnerable symbol is actually called from this code.
      - name: govulncheck
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  # Two jobs over the same files, and the halves do not overlap. actionlint
  # covers whether a workflow is correct at all — schema, expression syntax,
  # `needs:` naming a job that exists, and shellcheck over every `run:` block.
  # zizmor covers security: unpinned actions, leaked credentials, injectable
  # expressions.
  #
  # Separate jobs rather than two steps in one, for the reason hetzner-iac
  # records: a job name is a required check, and burying an audit inside
  # another job's name means nothing on the pull request says it ran.
  syntax:
    name: Workflow syntax
    needs: [changes]
    if: needs.changes.outputs.relevant != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: actionlint
        run: |
          set -euo pipefail
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          actionlint

  audit:
    name: Workflow permissions
    needs: [changes]
    if: needs.changes.outputs.relevant != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # These workflows are the part of the repository that runs with a token,
      # so they are worth auditing as code rather than trusted as config.
      #
      # regular, not auditor: the auditor persona is documented as tolerating
      # false positives, which is the wrong contract for a blocking gate — it
      # would be red forever and then ignored. Exceptions live in
      # .github/zizmor.yml, each with the reason it stands.
      #
      # pipx run rather than install, so nothing is left on the runner between
      # steps and the version in the command is the version that executes.
      - name: zizmor
        env:
          # Without a token zizmor runs offline and says so, skipping the
          # audits that need the API — resolving an action's ref among them.
          # Verified clean in both modes before this was turned on.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pipx run "zizmor==${ZIZMOR_VERSION}" \
            --config .github/zizmor.yml --persona=regular --format=plain .github/workflows/

  dispatch-release:
    name: Dispatch release
    needs: [changes, test, lint, vuln, syntax, audit]
    # The filter reports every push to main as relevant, so none of the five
    # above is ever skipped on this path and a plain `needs` is enough.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # POST /repos/{owner}/{repo}/dispatches needs write
    steps:
      - name: Dispatch the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --input rather than -f: client_payload is nested and the form
          # syntax cannot express that. Both values come from Actions itself
          # and arrive through env rather than an Actions expression inside
          # the script, so nothing here is substituted before the shell runs.
          gh api "repos/${GITHUB_REPOSITORY}/dispatches" --input - <<JSON
          {
            "event_type": "release",
            "client_payload": {
              "sha": "${GITHUB_SHA}",
              "ci_run_id": "${GITHUB_RUN_ID}"
            }
          }
          JSON
          printf '%s\n' "dispatched release for ${GITHUB_SHA}"
