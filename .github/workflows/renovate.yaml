name: Renovate

# Renovate runs here, in this repository's own Actions, rather than as the
# hosted GitHub App: installing the app needs rights on the account that were
# not available.
#
# Self-hosting costs a token and buys two things — the whole configuration,
# cadence included, is in this repository and reviewable in a diff, and no
# third-party service holds state about when it last ran.
#
# Dependabot was the alternative and it is what this replaces. It handles
# gomod, github-actions and npm natively but cannot see the six tool
# versions pinned inside ci.yaml's `env`, which is the entire reason this
# exists.
on:
  schedule:
    # Daily, 06:00 UTC. The two schedules are not a contradiction: this decides
    # how often Renovate RUNS, and renovate.json's decides what it may do when
    # it does. Regular updates wait for Monday so they batch into one review;
    # vulnerabilityAlerts are exempt and can land on any daily pass.
    - cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      ignoreSchedule:
        description: "Ignore renovate.json's schedule and act now"
        type: boolean
        default: true
      dryRun:
        description: "Log what would happen and open nothing"
        type: boolean
        default: false
      logLevel:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info

permissions: {}

concurrency:
  # One pass at a time. Two overlapping ones would both compute the same
  # updates and race to open the same branches.
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Dependency updates
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # the action reads this repository; RENOVATE_TOKEN does the writing
    env:
      # Where Task is unpacked, under the runner's temporary directory, and
      # where Renovate's container finds it.
      TASK_BIN_SUBDIR: task-bin
      TASK_CONTAINER_PATH: /usr/local/bin/task
    steps:
      # Said before the action runs, because without the secret the action
      # fails with an authentication error that says nothing about what to do.
      - name: Require the token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${RENOVATE_TOKEN}" ]; then
            printf '%s\n' "RENOVATE_TOKEN is set"
            exit 0
          fi

          printf '%s\n' "::error::the RENOVATE_TOKEN secret is not set"
          cat >&2 <<'MESSAGE'

          Renovate needs a token of its own. GITHUB_TOKEN cannot be used: GitHub
          starts no workflow run from an event it caused, so the checks on a
          Renovate pull request would never run and the request could never merge.

          Create a fine-grained personal access token scoped to this repository
          with:

            Contents        read and write   (branches)
            Pull requests   read and write   (the requests themselves)
            Issues          read and write   (the Dependency Dashboard)
            Workflows       read and write   (a bump to .github/workflows)

          Then: gh secret set RENOVATE_TOKEN
          MESSAGE
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A bump of the task library moves the pin in Taskfile.yaml, and
      # renovate.json then runs `task … tasklib:lock` on the branch so the
      # pull request carries the lock as well. Renovate runs that inside its
      # container, so the binary is unpacked here and mounted there.
      #
      # The version is ci.yaml's TASK_VERSION, read rather than repeated: a
      # second pin would be a second thing to keep in step.
      - name: Install Task
        run: |
          set -euo pipefail
          TASK_VERSION="$(awk -F'"' '/^  TASK_VERSION:/ { print $2 }' .github/workflows/ci.yaml)"
          if [ -z "$TASK_VERSION" ]; then
            printf '%s\n' "::error::ci.yaml declares no TASK_VERSION"
            exit 1
          fi
          base="https://github.com/go-task/task/releases/download/${TASK_VERSION}"
          archive="task_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$archive" "${base}/${archive}"
          curl -fsSL --retry 3 -o task_checksums.txt "${base}/task_checksums.txt"
          grep " ${archive}\$" task_checksums.txt | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/${TASK_BIN_SUBDIR}"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/${TASK_BIN_SUBDIR}" task

      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        env:
          # Repository configuration stays in .github/renovate.json. Only what
          # cannot live there — which repository to act on, and who to act as —
          # is here.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          # The one post-upgrade command, as the taskfiles preset in
          # renovate.json spells it. Renovate skips a command this does not
          # match with a log line and nothing else; `Task library lock` in
          # ci.yaml is what turns that pull request red.
          RENOVATE_ALLOWED_COMMANDS: '["^task --yes --offline=false --download tasklib:lock$"]'
          # Commits are authored by the bot, not by a person who did not write
          # them. The address is GitHub's own no-reply for the app.
          RENOVATE_GIT_AUTHOR: "renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>"
          # Renovate reads release notes from github.com to build pull request
          # bodies. Without it, notes are omitted and the requests are harder
          # to review.
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          # A manual run means "now", so it overrides the schedule in
          # renovate.json. Without this, dispatching on a Thursday would do
          # exactly nothing and look broken.
          RENOVATE_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.ignoreSchedule) && '{"schedule":null}' || '' }}
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          # /tmp:/tmp is the action's default, which naming any volume
          # replaces.
          docker-volumes: |
            /tmp:/tmp ;
            ${{ runner.temp }}/${{ env.TASK_BIN_SUBDIR }}/task:${{ env.TASK_CONTAINER_PATH }}:ro
