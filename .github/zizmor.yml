# zizmor configuration.
#
# One audit is relaxed for one file, with the reason stated. Everything else
# runs and the workflows are clean against it: actions are pinned to commit
# SHAs, no workflow input reaches a shell, and every job asks for the narrowest
# token it needs.
rules:
  artipacked:
    ignore:
      # release.yml is the one checkout in this repository that genuinely needs
      # its credentials: semantic-release pushes the tag it creates. Every
      # other checkout sets persist-credentials: false, which is what this
      # audit asks for.
      - release.yml
