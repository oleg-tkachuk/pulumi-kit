# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# pulumi-kit — the module's development tasks.
#
#   task --list
#   task verify-all      # before pushing; the same checks CI runs
#
# The shared library's Go verbs are flattened in: `task test`, not
# `task go:test`. Its lint, vuln and actionlint run the tools on PATH; CI pins
# its own versions in .github/workflows/ci.yaml.

silent: true

vars:
  # Shared task library — github.com/oleg-tkachuk/taskfiles, pinned.
  TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//%s?ref=v14.1.0'
  # The suite that drives a real pulumi CLI, behind a build tag so
  # `go test ./...` needs none; see internal/integration.
  INTEGRATION_TAG: integration
  INTEGRATION_PKG: ./internal/integration/

includes:
  go:
    taskfile: '{{printf .TASKLIB "go"}}'
    # The sha256 of this Taskfile at TASKLIB's ref. A tag can be moved, so a
    # moved tag fails rather than runs. Task does not template this field;
    # bump it with the ref, from the checksum Task reports it got.
    checksum: 9e9da097a7bcb0992d9705975c3405850ee8c82f34180589a746bdaf913cdb33
    dir: .
    flatten: true
    # Its test:integration says it needs Docker; the one below needs the
    # pulumi CLI and runs only the package CI runs.
    excludes: [test:integration]
    # GO_TEST_FLAGS spelled out as CI runs them: -race, and no -short.
    vars:
      PROJECT_NAME: pulumi-kit
      GO_TEST_FLAGS: -race
      GO_TEST_TAGS: '{{.INTEGRATION_TAG}}'

tasks:
  default:
    cmds:
      - task --list

  verify-all:
    desc: "gofmt + go mod tidy/verify + go vet + the unit suite + the tagged suite compiled + golangci-lint + govulncheck + actionlint — what CI runs, but the integration suite"
    cmds:
      - task: fmt:check
      - task: verify:tidy
      - task: vet
      - task: test
      - task: test:tagged:compile
      - task: lint
      - task: vuln
      - task: verify:workflows

  vet:
    desc: "go vet over the module"
    cmds:
      - go vet ./...

  verify:tidy:
    desc: "Fail when go.mod or go.sum is not what go mod tidy writes, or a download differs from go.sum"
    cmds:
      - go mod tidy -diff
      - go mod verify

  verify:workflows:
    desc: "actionlint over the workflows"
    preconditions:
      - sh: command -v actionlint >/dev/null
        msg: "actionlint is not installed — go install github.com/rhysd/actionlint/cmd/actionlint@latest"
    cmds:
      - actionlint

  test:integration:
    desc: "The packages against a real pulumi CLI, as CI's Pulumi CLI job runs them — needs pulumi on PATH"
    preconditions:
      - sh: command -v pulumi >/dev/null
        msg: "pulumi is not installed — https://www.pulumi.com/docs/install/"
    cmds:
      - go test -race -count=1 -tags {{.INTEGRATION_TAG}} {{.INTEGRATION_PKG}}

  deps:install:
    desc: "Install the release tooling (semantic-release) from package-lock.json"
    cmds:
      - npm ci --ignore-scripts
